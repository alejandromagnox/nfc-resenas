<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opiniones del comercio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="logo">
                ★
            </div>

            <h1 id="nombreNegocio">Cargando...</h1>

            <p class="direccion" id="direccionNegocio">
                Cargando dirección...
            </p>

            <div class="separador"></div>

            <h2>¿Cómo fue tu experiencia?</h2>

            <p class="descripcion">
                Tu opinión ayuda a este comercio y a otras personas
                que quieran conocerlo.
            </p>

            <div class="botones">

               

                <a id="botonDejarResena"
                   class="boton secundario"
                   href="#"
                   target="_blank">
                     Dejar una reseña
                </a>

            </div>

            <p class="pie">
                Gracias por compartir tu experiencia.
            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
